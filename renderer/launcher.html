<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>رفيق براعة</title>
<link rel="stylesheet" href="launcher.css">
</head>
<body>
<header class="top">
  <svg class="pen" viewBox="-30 -120 60 130" width="46" height="100" aria-hidden="true">
    <defs>
      <linearGradient id="s" x1="0" x2="1"><stop offset="0" stop-color="#0E4A40"/><stop offset=".4" stop-color="#2A8573"/><stop offset="1" stop-color="#0F5044"/></linearGradient>
      <linearGradient id="g" x1="0" x2="1"><stop offset="0" stop-color="#86692C"/><stop offset=".4" stop-color="#EBD59B"/><stop offset="1" stop-color="#7A5F26"/></linearGradient>
    </defs>
    <g transform="rotate(18)">
      <path d="M -9 -100 Q -10 -70 -7 -30 L -5 -18 L 5 -18 L 7 -30 Q 10 -70 9 -100 Z" fill="url(#s)"/>
      <ellipse cx="0" cy="-100" rx="9" ry="3.4" fill="#0B3F36"/>
      <rect x="-9.6" y="-80" width="19.2" height="7" rx="2" fill="url(#g)"/>
      <g transform="translate(0,-52)"><rect x="-5" y="-5" width="10" height="10" fill="url(#g)"/><rect x="-5" y="-5" width="10" height="10" fill="url(#g)" transform="rotate(45)"/></g>
      <path d="M -5.5 -20 L 5.5 -20 Q 5 -11 2.4 -4 L 0 0 L -.8 -4 Q -4.6 -11 -5.5 -20 Z" fill="#173B35"/>
      <circle cx="0" cy="1.5" r="2.4" fill="#E7CF93"/>
    </g>
  </svg>
  <div class="ttl">
    <h1>رفيق براعة</h1>
    <p>تدريبات تطبيقية تفاعلية. أنا «قلم»، أظهر فوق البرنامج الذي تتعلمه وأشير لك على كل زر، وأنت تضغط بنفسك.</p>
  </div>
  <div class="tools"><button class="chipbtn" id="btnUpdate" title="يفحص تحديثات البرنامج والدروس">تحقق من التحديثات</button></div>
</header>

<div id="banner" class="banner hidden"></div>

<main id="app"></main>

<footer>
  <span id="ver"></span>
  <span class="tip">للخروج أثناء أي درس: زر ✕ في الفقاعة، أو Ctrl+Alt+Q، أو أيقونة القلم في شريط المهام.</span>
</footer>
<script src="launcher.js"></script>
</body>
</html>
